[package]
name = "toiloki"
version = "1.0.0"
description = "Toiloki - Local-First Desktop Utility Suite (Rust + Tauri)"
authors = ["Toiloki Team"]
license = "MIT"
edition = "2021"

[lib]
name = "toiloki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rfd = "0.15"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
dirs = "5.0"
chrono = "0.4"
open = "5.3"
rayon = "1.10"
sysinfo = "0.30"
