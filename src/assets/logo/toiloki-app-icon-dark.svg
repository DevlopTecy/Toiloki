<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Ambient Aura Glow -->
    <filter id="dark-aura" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Squircle Card Background Gradient -->
    <linearGradient id="dark-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181A20" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>

    <!-- Symbol Gradients -->
    <linearGradient id="tk-stem-dark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="35%" stop-color="#FB8C00" />
      <stop offset="70%" stop-color="#F4511E" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <linearGradient id="tk-left-dark" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#BF360C" />
      <stop offset="30%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>

    <linearGradient id="tk-right-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="40%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>

    <filter id="tk-crease-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2.5" dy="2" stdDeviation="2.5" flood-color="#3E1103" flood-opacity="0.55" />
    </filter>

    <filter id="tk-stem-drop-dark" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#3E1103" flood-opacity="0.45" />
    </filter>

    <linearGradient id="tk-rim-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with 22.5% radius (28.8px on 128px) -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#dark-bg-grad)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.2" filter="url(#dark-aura)" />

  <!-- Inner Soft Bevel on Squircle -->
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />

  <!-- T Symbol Scaled & Centered (scale=0.82, transform) -->
  <g transform="translate(23, 23) scale(0.82)">
    <!-- Vertical Stem -->
    <rect x="37" y="24" width="26" height="64" rx="13" fill="url(#tk-stem-dark)" />

    <!-- Ambient Occlusion under crossbar -->
    <path d="M 37 39 L 63 39 L 63 49 C 63 45 50 43 37 46 Z" fill="#2E0E03" opacity="0.45" />

    <!-- Left Pill Arm -->
    <path d="M 24 13 L 50 13 L 50 39 L 24 39 C 16.8 39 11 33.2 11 26 C 11 18.8 16.8 13 24 13 Z" fill="url(#tk-left-dark)" filter="url(#tk-stem-drop-dark)" />

    <!-- Right Overlapping Pill Arm with curved inner boundary -->
    <path d="M 47 13 L 76 13 C 83.2 13 89 18.8 89 26 C 89 33.2 83.2 39 76 39 L 39 39 C 47.5 32 48 20 47 13 Z" fill="url(#tk-right-dark)" filter="url(#tk-crease-dark)" />

    <!-- Subtle Top Rim Highlight -->
    <path d="M 24 13.5 L 76 13.5 C 82.8 13.5 88.5 19 88.5 26 C 88.5 27 88.3 27.9 88 28.8 C 86.3 20 81 15 74.5 15 L 25.5 15 C 19 15 13.7 20 12 28.8 C 11.7 27.9 11.5 27 11.5 26 C 11.5 19 17.2 13.5 24 13.5 Z" fill="url(#tk-rim-dark)" />
  </g>
</svg>
