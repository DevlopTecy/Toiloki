<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <!-- Symbol Gradients -->
    <linearGradient id="tk-h-stem-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="35%" stop-color="#FB8C00" />
      <stop offset="70%" stop-color="#F4511E" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <linearGradient id="tk-h-left-light" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#BF360C" />
      <stop offset="30%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>

    <linearGradient id="tk-h-right-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="40%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>

    <filter id="tk-h-crease-light" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="1.5" stdDeviation="2" flood-color="#3E1103" flood-opacity="0.55" />
    </filter>

    <filter id="tk-h-stem-drop-light" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#3E1103" flood-opacity="0.45" />
    </filter>

    <linearGradient id="tk-h-rim-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Container Pill -->
  <rect x="2" y="2" width="316" height="60" rx="30" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1.2" />

  <!-- T Icon (44px) -->
  <g transform="translate(14, 10) scale(0.44)">
    <rect x="37" y="24" width="26" height="64" rx="13" fill="url(#tk-h-stem-light)" />
    <path d="M 37 39 L 63 39 L 63 49 C 63 45 50 43 37 46 Z" fill="#2E0E03" opacity="0.45" />
    <path d="M 24 13 L 50 13 L 50 39 L 24 39 C 16.8 39 11 33.2 11 26 C 11 18.8 16.8 13 24 13 Z" fill="url(#tk-h-left-light)" filter="url(#tk-h-stem-drop-light)" />
    <path d="M 47 13 L 76 13 C 83.2 13 89 18.8 89 26 C 89 33.2 83.2 39 76 39 L 39 39 C 47.5 32 48 20 47 13 Z" fill="url(#tk-h-right-light)" filter="url(#tk-h-crease-light)" />
    <path d="M 24 13.5 L 76 13.5 C 82.8 13.5 88.5 19 88.5 26 C 88.5 27 88.3 27.9 88 28.8 C 86.3 20 81 15 74.5 15 L 25.5 15 C 19 15 13.7 20 12 28.8 C 11.7 27.9 11.5 27 11.5 26 C 11.5 19 17.2 13.5 24 13.5 Z" fill="url(#tk-h-rim-light)" />
  </g>

  <!-- Typography: Clean Bold Wordmark & Subtitle -->
  <text x="70" y="34" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="0.04em" fill="#0A0D14">TOILOKI</text>
  <text x="71" y="48" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="0.22em" fill="#58606E">LOCAL UTILITY SUITE</text>
</svg>
